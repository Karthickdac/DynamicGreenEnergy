server {
    listen 80;
    server_name erp.dynamicgreenenergy.in;

    # Redirect HTTP → HTTPS (uncomment after SSL setup)
    # return 301 https://$host$request_uri;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Static assets — long cache
    location /assets/ {
        alias /home/dynamicgreenenergy-erp/htdocs/erp.dynamicgreenenergy.in/dist/public/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Images
    location /images/ {
        alias /home/dynamicgreenenergy-erp/htdocs/erp.dynamicgreenenergy.in/dist/public/images/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Static files (favicon, fonts, etc.)
    location ~* \.(ico|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot)$ {
        root /home/dynamicgreenenergy-erp/htdocs/erp.dynamicgreenenergy.in/dist/public;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri @node;
    }

    # All other requests → Node.js app
    location / {
        proxy_pass http://127.0.0.1:6100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    location @node {
        proxy_pass http://127.0.0.1:6100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

